  <!-- MAIN 3D APPLICATION WITH LIVING PROCEDURAL CHARACTERS -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /**********************************************************************
     * 1. BATTLE SOUND SYNTHESIZER (Web Audio API)
     **********************************************************************/
    class BattleSoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSelect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      playStepImpact(type) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const isCavalry = type === 'H';
        const isChariot = type === 'R';
        osc.frequency.setValueAtTime(isChariot ? 120 : isCavalry ? 180 : 220, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.14);
      }
      playCombatExplosion(type) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Deep Cannon / Sword Clang Explosion
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(type === 'C' ? 95 : 150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.32);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      }
      playCheckHorns() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [220, 277.18, 329.63, 440].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.06);
          gain.gain.setValueAtTime(0.18, now + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.06);
          osc.stop(now + idx * 0.06 + 0.52);
        });
      }
    }
    const sound = new BattleSoundSynth();

    /**********************************************************************
     * 2. COMPLETE WXF XIANGQI RULE ENGINE
     **********************************************************************/
    const PIECE_META = {
      K: { nameVi: 'Tướng', hanRed: '帥', hanBlack: '將', value: 1000 },
      A: { nameVi: 'Sĩ', hanRed: '仕', hanBlack: '士', value: 20 },
      E: { nameVi: 'Tượng', hanRed: '相', hanBlack: '象', value: 20 },
      R: { nameVi: 'Xe', hanRed: '俥', hanBlack: '車', value: 90 },
      C: { nameVi: 'Pháo', hanRed: '炮', hanBlack: '砲', value: 45 },
      H: { nameVi: 'Mã', hanRed: '傌', hanBlack: '馬', value: 40 },
      P: { nameVi: 'Tốt', hanRed: '兵', hanBlack: '卒', value: 10 },
    };

    const INITIAL_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR r - - 0 1';

    function parseFEN(fen) {
      const [rowsPart, turnPart] = fen.trim().split(/\s+/);
      const rows = rowsPart.split('/');
      const board = Array.from({ length: 10 }, () => Array(9).fill(null));
      const mapChar = { k: 'K', a: 'A', b: 'E', e: 'E', r: 'R', c: 'C', n: 'H', h: 'H', p: 'P' };
      for (let r = 0; r < 10; r++) {
        let c = 0;
        for (const ch of rows[r] || '') {
          if (/\d/.test(ch)) c += parseInt(ch, 10);
          else {
            const side = ch === ch.toUpperCase() ? 'r' : 'b';
            const type = mapChar[ch.toLowerCase()];
            if (type && c < 9) board[r][c] = { type, side };
            c++;
          }
        }
      }
      return { board, turn: turnPart === 'b' ? 'b' : 'r' };
    }

    function inBounds(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 9; }
    function inPalace(side, r, c) {
      if (c < 3 || c > 5) return false;
      return side === 'r' ? r >= 7 && r <= 9 : r >= 0 && r <= 2;
    }
    function cloneBoard(b) { return b.map((row) => row.map((cell) => (cell ? { ...cell } : null))); }

    function getPseudoTargets(board, r, c) {
      const p = board[r][c];
      if (!p) return [];
      const targets = [];
      const addIfValid = (nr, nc) => {
        if (!inBounds(nr, nc)) return;
        const dest = board[nr][nc];
        if (!dest || dest.side !== p.side) targets.push({ r: nr, c: nc });
      };

      if (p.type === 'K') {
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          if (inPalace(p.side, r + dr, c + dc)) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'A') {
        [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([dr, dc]) => {
          if (inPalace(p.side, r + dr, c + dc)) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'E') {
        [[-2, -2, -1, -1], [-2, 2, -1, 1], [2, -2, 1, -1], [2, 2, 1, 1]].forEach(([dr, dc, er, ec]) => {
          const nr = r + dr, nc = c + dc;
          if (!inBounds(nr, nc)) return;
          if (p.side === 'r' && nr < 5) return;
          if (p.side === 'b' && nr > 4) return;
          if (!board[r + er][c + ec]) addIfValid(nr, nc);
        });
      } else if (p.type === 'H') {
        const jumps = [
          [-2, -1, -1, 0], [-2, 1, -1, 0], [2, -1, 1, 0], [2, 1, 1, 0],
          [-1, -2, 0, -1], [1, -2, 0, -1], [-1, 2, 0, 1], [1, 2, 0, 1],
        ];
        jumps.forEach(([dr, dc, lr, lc]) => {
          if (inBounds(r + dr, c + dc) && !board[r + lr][c + lc]) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'R' || p.type === 'C') {
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          let nr = r + dr, nc = c + dc;
          let jumped = false;
          while (inBounds(nr, nc)) {
            const occ = board[nr][nc];
            if (p.type === 'R') {
              if (!occ) targets.push({ r: nr, c: nc });
              else {
                if (occ.side !== p.side) targets.push({ r: nr, c: nc });
                break;
              }
            } else {
              if (!jumped) {
                if (!occ) targets.push({ r: nr, c: nc });
                else jumped = true;
              } else if (occ) {
                if (occ.side !== p.side) targets.push({ r: nr, c: nc });
                break;
              }
            }
            nr += dr;
            nc += dc;
          }
        });
      } else if (p.type === 'P') {
        const fwd = p.side === 'r' ? -1 : 1;
        addIfValid(r + fwd, c);
        const crossed = p.side === 'r' ? r <= 4 : r >= 5;
        if (crossed) {
          addIfValid(r, c - 1);
          addIfValid(r, c + 1);
        }
      }
      return targets;
    }

    function findKing(board, side) {
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.type === 'K' && p.side === side) return { r, c };
        }
      }
      return null;
    }

    function areKingsFacing(board) {
      const rk = findKing(board, 'r');
      const bk = findKing(board, 'b');
      if (!rk || !bk || rk.c !== bk.c) return false;
      for (let r = bk.r + 1; r < rk.r; r++) {
        if (board[r][rk.c]) return false;
      }
      return true;
    }

    function isKingInCheck(board, side) {
      if (areKingsFacing(board)) return true;
      const k = findKing(board, side);
      if (!k) return false;
      const opp = side === 'r' ? 'b' : 'r';
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.side === opp) {
            const targets = getPseudoTargets(board, r, c);
            if (targets.some((t) => t.r === k.r && t.c === k.c)) return true;
          }
        }
      }
      return false;
    }

    function getLegalMoves(board, r, c) {
      const p = board[r][c];
      if (!p) return [];
      const pseudo = getPseudoTargets(board, r, c);
      const legal = [];
      for (const to of pseudo) {
        const next = cloneBoard(board);
        const captured = next[to.r][to.c];
        next[to.r][to.c] = p;
        next[r][c] = null;
        if (!isKingInCheck(next, p.side)) {
          const f1 = p.side === 'r' ? 9 - c : c + 1;
          const f2 = p.side === 'r' ? 9 - to.c : to.c + 1;
          const notation = `${PIECE_META[p.type].nameVi} ${f1} -> ${f2}`;
          legal.push({ from: { r, c }, to, piece: p, captured, notation });
        }
      }
      return legal;
    }

    function getAllLegalMoves(board, side) {
      const all = [];
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.side === side) all.push(...getLegalMoves(board, r, c));
        }
      }
      return all;
    }

    function evaluateBoard(board) {
      let score = 0;
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (!p) continue;
          let val = PIECE_META[p.type].value;
          if (p.type === 'P' && (p.side === 'r' ? r <= 4 : r >= 5)) val += 12;
          score += p.side === 'r' ? val : -val;
        }
      }
      return score;
    }

    function findBestAIMove(board, side) {
      const moves = getAllLegalMoves(board, side);
      if (moves.length === 0) return null;
      let bestMove = moves[0];
      let bestVal = side === 'r' ? -Infinity : Infinity;
      for (const m of moves) {
        const next = cloneBoard(board);
        next[m.to.r][m.to.c] = m.piece;
        next[m.from.r][m.from.c] = null;
        const val = evaluateBoard(next);
        if ((side === 'r' && val > bestVal) || (side === 'b' && val < bestVal)) {
          bestVal = val;
          bestMove = m;
        }
      }
      return bestMove;
    }

    /**********************************************************************

     * 4. PROCEDURAL BOARD WITH SPLATTERED INK BANNER & FAIRY CLOUDS
     **********************************************************************/
    function generateInkBoardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2240;
      const ctx = canvas.getContext('2d');

      // Light pine/ash wood surface
      const grad = ctx.createRadialGradient(1024, 1120, 150, 1024, 1120, 1450);
      grad.addColorStop(0, '#e8cf9b');
      grad.addColorStop(0.7, '#d6b170');
      grad.addColorStop(1, '#b88b48');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Fine wood fibers
      ctx.strokeStyle = 'rgba(74, 44, 15, 0.04)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 200; i++) {
        const y = (i / 200) * canvas.height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(680, y - 15, 1360, y + 15, canvas.width, y);
        ctx.stroke();
      }

      const padX = 184;
      const padY = 182;
      const stepX = (canvas.width - padX * 2) / 8;
      const stepY = (canvas.height - padY * 2) / 9;
      const toX = (c) => padX + c * stepX;
      const toY = (r) => padY + r * stepY;

      // Outer Inscribed Frame
      ctx.strokeStyle = '#381f08';
      ctx.lineWidth = 9;
      ctx.strokeRect(padX - 24, padY - 24, stepX * 8 + 48, stepY * 9 + 48);

      // 10 Horizontal Ranks & 9 Vertical Files
      ctx.lineWidth = 3.5;
      for (let r = 0; r < 10; r++) {
        ctx.beginPath();
        ctx.moveTo(toX(0), toY(r));
        ctx.lineTo(toX(8), toY(r));
        ctx.stroke();
      }
      for (let c = 0; c < 9; c++) {
        if (c === 0 || c === 8) {
          ctx.beginPath();
          ctx.moveTo(toX(c), toY(0));
          ctx.lineTo(toX(c), toY(9));
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.moveTo(toX(c), toY(0));
          ctx.lineTo(toX(c), toY(4));
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(toX(c), toY(5));
          ctx.lineTo(toX(c), toY(9));
          ctx.stroke();
        }
      }

      // Nine Palace Diagonals
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      [
        [3, 0, 5, 2], [5, 0, 3, 2],
        [3, 7, 5, 9], [5, 7, 3, 9],
      ].forEach(([c1, r1, c2, r2]) => {
        ctx.beginPath();
        ctx.moveTo(toX(c1), toY(r1));
        ctx.lineTo(toX(c2), toY(r2));
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // Center River Splattered Ink Banner (From User Screenshot)
      const riverCenterY = (toY(4) + toY(5)) / 2;
      ctx.save();
      ctx.fillStyle = 'rgba(15, 10, 8, 0.88)';
      ctx.beginPath();
      ctx.ellipse(canvas.width / 2, riverCenterY, 520, 85, 0, 0, Math.PI * 2);
      ctx.fill();

      // Splattered ink drops
      for (let i = 0; i < 45; i++) {
        const rx = canvas.width / 2 + (Math.random() - 0.5) * 1100;
        const ry = riverCenterY + (Math.random() - 0.5) * 160;
        const rRad = 4 + Math.random() * 16;
        ctx.beginPath();
        ctx.arc(rx, ry, rRad, 0, Math.PI * 2);
        ctx.fill();
      }

      // Gold River Calligraphy
      ctx.fillStyle = '#fce7b2';
      ctx.shadowColor = '#d97706';
      ctx.shadowBlur = 10;
      ctx.font = '900 62px "Ma Shan Zheng", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('楚河漢界 • SỞ HÀ HÁN GIỚI', canvas.width / 2, riverCenterY);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    function add3DArrow(from, to, hex = 0xfacc15) {
      if (from.r === to.r && from.c === to.c) return;
      const p1 = gridToWorld(from.r, from.c);
      const p2 = gridToWorld(to.r, to.c);
      const dx = p2.x - p1.x;
      const dz = p2.z - p1.z;
      const len = Math.hypot(dx, dz);
      const headLen = 0.35;
      const shaftLen = Math.max(0.1, len - headLen);

      const grp = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.9 });
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, shaftLen, 12), mat);
      shaft.rotation.x = Math.PI / 2;
      shaft.position.z = shaftLen / 2;
      grp.add(shaft);

      const head = new THREE.Mesh(new THREE.ConeGeometry(0.16, headLen, 16), mat);
      head.rotation.x = Math.PI / 2;
      head.position.z = shaftLen + headLen / 2;
      grp.add(head);

      grp.position.set(p1.x, 0.15, p1.z);
      grp.rotation.y = Math.atan2(dx, dz);
      arrowsRoot.add(grp);
    }

    function triggerCaptureCombatVFX(coord, capturedPiece, attackerPiece) {
      const { x, z } = gridToWorld(coord.r, coord.c);
      sound.playCombatExplosion(attackerPiece?.type);

      // Expanding Shockwave Ring
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.3, 36),
        new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0.95 })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(x, 0.03, z);
      vfxRoot.add(ring);
      gsap.to(ring.scale, { x: 5, y: 5, duration: 0.5, ease: 'power2.out' });
      gsap.to(ring.material, { opacity: 0, duration: 0.5, onComplete: () => vfxRoot.remove(ring) });

      // Spark / Shard Particles
      for (let i = 0; i < 40; i++) {
        const shard = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.06, 0),
          new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xfacc15 : 0xef4444, transparent: true })
        );
        shard.position.set(x, 0.4, z);
        vfxRoot.add(shard);
        const ang = Math.random() * Math.PI * 2;
        const dist = 0.6 + Math.random() * 1.4;
        gsap.to(shard.position, {
          x: x + Math.cos(ang) * dist,
          y: 0.2 + Math.random() * 1.2,
          z: z + Math.sin(ang) * dist,
          duration: 0.48,
        });
        gsap.to(shard.material, { opacity: 0, duration: 0.48, onComplete: () => vfxRoot.remove(shard) });
      }
    }

    /**********************************************************************
     * 7. GAME STATE & PARABOLIC TROOP MARCH ANIMATION
     **********************************************************************/
    let boardState = parseFEN(INITIAL_FEN).board;
    let currentTurn = 'r';
    let selectedCoord = null;
    let currentLegalMoves = [];
    let moveHistory = [];
    let isAnimating = false;
    let vsAI = true;

    const unitMeshes = new Map();

    function renderBoardUnits(board) {
      clearGroup(unitsRoot);
      clearGroup(indicatorsRoot);
      unitMeshes.clear();
      selHalo.visible = false;

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p) {
            const unit = buildLiving3DUnit(p.type, p.side);
            const pos = gridToWorld(r, c);
            unit.position.set(pos.x, 0, pos.z);
            unit.userData = { isUnit: true, r, c, type: p.type, side: p.side };
            unitsRoot.add(unit);
            unitMeshes.set(`${r},${c}`, unit);
          }
        }
      }
      updateHUD();
    }

    function selectSquare(r, c) {
      if (isAnimating) return;

      if (selectedCoord) {
        const move = currentLegalMoves.find((m) => m.to.r === r && m.to.c === c);
        if (move) {
          executeTroopMove(move);
          return;
        }
      }

      const p = boardState[r][c];
      if (p && p.side === currentTurn) {
        selectedCoord = { r, c };
        currentLegalMoves = getLegalMoves(boardState, r, c);
        sound.playSelect();

        const pos = gridToWorld(r, c);
        selHalo.position.set(pos.x, 0.02, pos.z);
        selHalo.visible = true;

        // Render legal moves
        clearGroup(indicatorsRoot);
        currentLegalMoves.forEach((m) => {
          const pt = gridToWorld(m.to.r, m.to.c);
          const isCap = Boolean(boardState[m.to.r][m.to.c]);
          const orb = new THREE.Mesh(
            new THREE.SphereGeometry(isCap ? 0.22 : 0.14, 16, 16),
            new THREE.MeshStandardMaterial({
              color: isCap ? 0xef4444 : 0x10b981,
              emissive: isCap ? 0xb91c1c : 0x059669,
              emissiveIntensity: 0.9,
            })
          );
          orb.position.set(pt.x, 0.22, pt.y || pt.z);
          indicatorsRoot.add(orb);
        });
      } else {
        selectedCoord = null;
        currentLegalMoves = [];
        selHalo.visible = false;
        clearGroup(indicatorsRoot);
      }
    }

    function executeTroopMove(move) {
      isAnimating = true;
      selectedCoord = null;
      currentLegalMoves = [];
      selHalo.visible = false;
      clearGroup(indicatorsRoot);
      clearGroup(arrowsRoot);

      const fromKey = `${move.from.r},${move.from.c}`;
      const toKey = `${move.to.r},${move.to.c}`;
      const mover = unitMeshes.get(fromKey);
      const target = unitMeshes.get(toKey);

      const start = gridToWorld(move.from.r, move.from.c);
      const end = gridToWorld(move.to.r, move.to.c);

      moveHistory.push({
        move,
        prevBoard: cloneBoard(boardState),
        prevTurn: currentTurn,
      });

      boardState[move.to.r][move.to.c] = move.piece;
      boardState[move.from.r][move.from.c] = null;

      // Parabolic Bézier Troop Movement
      const proxy = { t: 0 };
      gsap.to(proxy, {
        t: 1,
        duration: 0.45,
        ease: 'power2.inOut',
        onUpdate: () => {
          const t = proxy.t;
          if (mover) {
            mover.position.x = start.x + (end.x - start.x) * t;
            mover.position.z = start.z + (end.z - start.z) * t;
            mover.position.y = 4 * 1.35 * t * (1 - t);
            mover.rotation.y = Math.atan2(end.x - start.x, end.z - start.z);
          }
        },
        onComplete: () => {
          if (mover) {
            mover.position.set(end.x, 0, end.z);
            mover.rotation.set(0, 0, 0);
            mover.userData.r = move.to.r;
            mover.userData.c = move.to.c;
          }

          if (target && move.captured) {
            unitsRoot.remove(target);
            triggerCaptureCombatVFX(move.to, move.captured, move.piece);
          } else {
            sound.playStepImpact(move.piece.type);
          }

          unitMeshes.delete(fromKey);
          if (mover) unitMeshes.set(toKey, mover);

          currentTurn = currentTurn === 'r' ? 'b' : 'r';
          updateHUD(move);

          // Check Alert
          if (isKingInCheck(boardState, currentTurn)) {
            sound.playCheckHorns();
            const vig = document.getElementById('check-vignette');
            const ban = document.getElementById('check-banner');
            vig.style.opacity = '1';
            gsap.fromTo(ban, { opacity: 0, scale: 0.4 }, {
              opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.8)',
              onComplete: () => {
                gsap.to(ban, { opacity: 0, scale: 1.3, delay: 0.7, duration: 0.35 });
                setTimeout(() => vig.style.opacity = '0', 800);
              }
            });
          }

          isAnimating = false;

          // AI Auto-Move
          if (vsAI && currentTurn === 'b') {
            setTimeout(() => {
              const aiMove = findBestAIMove(boardState, 'b');
              if (aiMove) executeTroopMove(aiMove);
            }, 450);
          }
        },
      });
    }

    function updateHUD(latest = null) {
      const badge = document.getElementById('turn-badge');
      if (currentTurn === 'r') {
        badge.textContent = '🔴 ĐỎ: HÁN VƯƠNG TIÊN THỦ';
        badge.className = 'px-3 py-1.5 rounded-xl bg-red-950/90 border border-red-500/60 text-amber-100 font-black shadow-inner';
      } else {
        badge.textContent = '⚫ ĐEN: SỞ BÁ VƯƠNG HẬU THỦ';
        badge.className = 'px-3 py-1.5 rounded-xl bg-slate-900 border border-cyan-400/60 text-cyan-100 font-black shadow-inner';
      }

      // Eval Bar
      const score = evaluateBoard(boardState);
      const clamped = Math.max(-250, Math.min(250, score));
      const redPct = Math.round(50 + (clamped / 250) * 45);
      document.getElementById('eval-red-bar').style.height = `${redPct}%`;
      document.getElementById('eval-black-bar').style.height = `${100 - redPct}%`;
      document.getElementById('eval-score-text').textContent = (score / 10).toFixed(1);

      // History
      document.getElementById('move-count-badge').textContent = `${moveHistory.length} Nước`;
      const historyEl = document.getElementById('history-box');
      if (moveHistory.length === 0) {
        historyEl.innerHTML = '<div class="text-stone-400 italic text-center py-6">Hai quân đang dàn trận...</div>';
      } else {
        historyEl.innerHTML = moveHistory.map((h, i) => `
          <div class="flex items-center justify-between px-2 py-1 rounded bg-white/5 font-mono">
            <span class="text-amber-400/70">#${i + 1}</span>
            <span class="${h.move.piece.side === 'r' ? 'text-red-300' : 'text-cyan-300'} font-bold">${h.move.notation}</span>
          </div>
        `).join('');
        historyEl.scrollTop = historyEl.scrollHeight;
      }
    }

    /**********************************************************************
     * 8. RAYCASTING, CAMERA & BUTTON EVENT LISTENERS
     **********************************************************************/
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button === 0 && !controls.enabled) {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(unitsRoot.children, true);
        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData?.isUnit) obj = obj.parent;
          if (obj?.userData?.isUnit) {
            selectSquare(obj.userData.r, obj.userData.c);
            return;
          }
        }

        const planeHit = raycaster.intersectObject(hitPlane);
        if (planeHit.length > 0) {
          const pt = planeHit[0].point;
          const g = worldToGrid(pt.x, pt.z);
          if (g) selectSquare(g.r, g.c);
        }
      }
    });

    // Ink Seals
    let camStep = 0;
    document.getElementById('seal-camera').addEventListener('click', () => {
      camStep = (camStep + 1) % 3;
      if (camStep === 0) {
        controls.enabled = false;
        gsap.to(camera.position, { x: 0, y: 11.5, z: 9.5, duration: 0.8, onUpdate: () => camera.lookAt(0, 0, 0) });
      } else if (camStep === 1) {
        controls.enabled = false;
        gsap.to(camera.position, { x: 0, y: 14.5, z: 0.5, duration: 0.8, onUpdate: () => camera.lookAt(0, 0, 0) });
      } else {
        controls.enabled = true;
      }
    });

    document.getElementById('seal-sound').addEventListener('click', (e) => {
      sound.muted = !sound.muted;
      e.currentTarget.classList.toggle('opacity-50', sound.muted);
    });

    document.getElementById('seal-undo').addEventListener('click', () => {
      if (moveHistory.length === 0 || isAnimating) return;
      const last = moveHistory.pop();
      boardState = last.prevBoard;
      currentTurn = last.prevTurn;
      renderBoardUnits(boardState);
    });

    document.getElementById('seal-restart').addEventListener('click', () => {
      boardState = parseFEN(INITIAL_FEN).board;
      currentTurn = 'r';
      moveHistory = [];
      renderBoardUnits(boardState);
    });

    document.getElementById('seal-hint').addEventListener('click', () => {
      const best = findBestAIMove(boardState, currentTurn);
      if (best) {
        clearGroup(arrowsRoot);
        add3DArrow(best.from, best.to, 0xfacc15);
        sound.playSelect();
      }
    });

    document.getElementById('btn-toggle-ai').addEventListener('click', (e) => {
      vsAI = !vsAI;
      e.target.textContent = vsAI ? '🤖 Đấu AI: BẬT' : '👥 2 Người: TẮT AI';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 60FPS Animation Loop with Living Character Idle Breathing
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (controls.enabled) controls.update();

      // Living Character Idle Breathing & Weapon Sway
      unitsRoot.children.forEach((u, i) => {
        if (u.userData?.bobGroup) {
          u.userData.bobGroup.position.y = 0.09 + Math.sin(elapsed * 2.5 + i * 0.4) * 0.015;
        }
      });

      // Swirling Peach Blossom Petals
      const posAttr = petalGeo.attributes.position;
      for (let i = 0; i < petalCount; i++) {
        let y = posAttr.getY(i) - 0.015;
        let x = posAttr.getX(i) + Math.sin(elapsed + i) * 0.008;
        if (y < -1) y = 7;
        posAttr.setY(i, y);
        posAttr.setX(i, x);
      }
      posAttr.needsUpdate = true;

      renderer.render(scene, camera);
    }

    camera.lookAt(0, 0, 0);
    renderBoardUnits(boardState);
    animate();
  </script>
</body>
