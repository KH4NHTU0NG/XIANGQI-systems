    /* Ink-Wash Floating Clouds at Screen Corners */
    .ink-cloud-corner {
      pointer-events: none;
      position: fixed;

      filter: drop-shadow(0 8px 20px rgba(30, 20, 10, 0.18));

      100% { transform: translate(14px, -8px) scale(1.04); }

    /* Traditional Black Ink-Blot Button with Ink-Spread Hover (Loang Mực Nhẹ) */
    .ink-blot-btn {
      position: relative;
      width: 74px;
      height: 74px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fdf6e3;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease;
      filter: drop-shadow(0 6px 14px rgba(10, 6, 3, 0.55));
      z-index: 20;
    }
    .ink-blot-btn::before {
      content: '';
      position: absolute;
      inset: 2px;
      background:
        radial-gradient(circle at 48% 50%, #16110e 0%, #0b0806 66%, transparent 72%),
        radial-gradient(circle at 20% 28%, #120d0a 0%, transparent 28%),
        radial-gradient(circle at 82% 24%, #120d0a 0%, transparent 26%),
        radial-gradient(circle at 80% 76%, #120d0a 0%, transparent 28%),
        radial-gradient(circle at 22% 78%, #120d0a 0%, transparent 26%),
        radial-gradient(circle at 50% 10%, #120d0a 0%, transparent 24%),
        radial-gradient(circle at 52% 90%, #120d0a 0%, transparent 24%);
      border-radius: 55% 45% 60% 40% / 44% 58% 42% 56%;
      border: 1.5px solid rgba(252, 231, 178, 0.55);
      z-index: -1;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }
    /* Outer Ink Splatter Droplets */
    .ink-blot-btn::after {
      content: '';
      position: absolute;
      inset: -6px;
      background:
        radial-gradient(circle at 12% 20%, #120d0a 3px, transparent 4px),
        radial-gradient(circle at 88% 18%, #120d0a 3.5px, transparent 4.5px),
        radial-gradient(circle at 90% 82%, #120d0a 2.5px, transparent 3.5px),
        radial-gradient(circle at 14% 85%, #120d0a 3px, transparent 4px),
        radial-gradient(circle at 50% 2%, #120d0a 2px, transparent 3px);
      pointer-events: none;
      z-index: -1;
      transition: transform 0.38s ease, opacity 0.38s ease;
    }
    /* Hover Ink-Spread Effect (Hiệu ứng loang mực nhẹ) */
    .ink-blot-btn:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.65));
    }
    .ink-blot-btn:hover::before {
      transform: scale(1.09) rotate(-5deg);
      border-color: #fde68a;
      box-shadow: inset 0 0 16px rgba(251, 191, 36, 0.38), 0 0 18px rgba(15, 10, 6, 0.85);
    }
    .ink-blot-btn:hover::after {
      transform: scale(1.18) rotate(8deg);
    }
    .ink-blot-btn:active {
      transform: scale(0.95);
    }

  <!-- MAIN WEBGL + GLSL SHADER + OUTLINE EFFECT MODULE -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    /**********************************************************************
     * MODULE 1: CUSTOM GLSL SHADERS (Bagua Magic Circle & Sword-Qi God-Rays)
     **********************************************************************/
    const BAGUA_VERTEX_SHADER = /* glsl */ `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const BAGUA_FRAGMENT_SHADER = /* glsl */ `
      uniform float uTime;
      uniform vec3 uColor;
      uniform sampler2D uBaguaTex;
      varying vec2 vUv;

      void main() {
        vec2 centered = vUv - 0.5;
        float r = length(centered) * 2.0;
        float angle = atan(centered.y, centered.x);

        float c = cos(uTime * 1.15);
        float s = sin(uTime * 1.15);
        vec2 rotUv = vec2(
          centered.x * c - centered.y * s + 0.5,
          centered.x * s + centered.y * c + 0.5
        );

        vec4 texCol = texture2D(uBaguaTex, rotUv);
        float pulseRing = smoothstep(0.035, 0.0, abs(r - fract(uTime * 0.45) * 0.95)) * (1.0 - r);
        float octagonWave = 0.5 + 0.5 * cos(angle * 8.0 - uTime * 3.2);
        float outerHalo = smoothstep(0.94, 0.85, r) * smoothstep(0.68, 0.82, r) * octagonWave * 0.65;

        float alpha = clamp(texCol.a * 1.2 + pulseRing * 0.9 + outerHalo, 0.0, 1.0) * smoothstep(1.0, 0.88, r);
        vec3 finalColor = mix(uColor, vec3(1.0, 0.98, 0.82), texCol.r * 0.75 + pulseRing);
        gl_FragColor = vec4(finalColor, alpha);
      }
    `;

    const SHOCKWAVE_GODRAYS_FRAGMENT_SHADER = /* glsl */ `
      uniform float uProgress;
      uniform vec3 uPrimaryColor;
      uniform vec3 uSecondaryColor;
      varying vec2 vUv;

      void main() {
        vec2 p = (vUv - 0.5) * 2.0;
        float r = length(p);
        float theta = atan(p.y, p.x);

        // Expanding Golden Shockwave Ring
        float waveRadius = uProgress * 0.95;
        float ringThickness = mix(0.16, 0.02, uProgress);
        float shockRing = smoothstep(ringThickness, 0.0, abs(r - waveRadius));

        // Radial God-Rays (Light Rays bursting across the board)
        float rays1 = max(0.0, cos(theta * 14.0 + uProgress * 9.0));
        float rays2 = max(0.0, sin(theta * 22.0 - uProgress * 14.0));
        float godRays = pow(rays1 * 0.65 + rays2 * 0.35, 2.6) * smoothstep(1.0, 0.08, r) * (1.0 - uProgress);

        float coreFlash = smoothstep(0.48, 0.0, r) * pow(1.0 - uProgress, 1.8);
        float fade = 1.0 - smoothstep(0.72, 1.0, uProgress);
        float alpha = clamp((shockRing * 1.3 + godRays * 1.1 + coreFlash) * fade, 0.0, 1.0) * smoothstep(1.0, 0.9, r);

        vec3 col = mix(uSecondaryColor, uPrimaryColor, shockRing + coreFlash * 0.8);
        gl_FragColor = vec4(col, alpha);
      }

    /**********************************************************************
     * MODULE 3: COMPLETE XIANGQI RULE ENGINE
     **********************************************************************/
    const PIECE_META = {
      K: { nameVi: 'Tướng', hanRed: '帥', hanBlack: '將', value: 1000 },
      A: { nameVi: 'Sĩ', hanRed: '仕', hanBlack: '士', value: 20 },
      E: { nameVi: 'Tượng', hanRed: '相', hanBlack: '象', value: 20 },
      R: { nameVi: 'Xe', hanRed: '俥', hanBlack: '車', value: 90 },
      C: { nameVi: 'Pháo', hanRed: '炮', hanBlack: '砲', value: 45 },
      H: { nameVi: 'Mã', hanRed: '傌', hanBlack: '馬', value: 40 },
      P: { nameVi: 'Tốt', hanRed: '兵', hanBlack: '卒', value: 10 },
    };

    const INITIAL_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR r - - 0 1';

    function parseFEN(fen) {
      const [rowsPart, turnPart] = fen.trim().split(/\s+/);
      const rows = rowsPart.split('/');
      const board = Array.from({ length: 10 }, () => Array(9).fill(null));
      const mapChar = { k: 'K', a: 'A', b: 'E', e: 'E', r: 'R', c: 'C', n: 'H', h: 'H', p: 'P' };
      for (let r = 0; r < 10; r++) {
        let c = 0;
        for (const ch of rows[r] || '') {
          if (/\d/.test(ch)) c += parseInt(ch, 10);
          else {
            const side = ch === ch.toUpperCase() ? 'r' : 'b';
            const type = mapChar[ch.toLowerCase()];
            if (type && c < 9) board[r][c] = { type, side };
            c++;
          }
        }
      }
      return { board, turn: turnPart === 'b' ? 'b' : 'r' };
    }

    function inBounds(r, c) { return r >= 0 && r < 10 && c >= 0 && c < 9; }
    function inPalace(side, r, c) {
      if (c < 3 || c > 5) return false;
      return side === 'r' ? r >= 7 && r <= 9 : r >= 0 && r <= 2;
    }
    function cloneBoard(b) { return b.map((row) => row.map((cell) => (cell ? { ...cell } : null))); }

    function getPseudoTargets(board, r, c) {
      const p = board[r][c];
      if (!p) return [];
      const targets = [];
      const addIfValid = (nr, nc) => {
        if (!inBounds(nr, nc)) return;
        const dest = board[nr][nc];
        if (!dest || dest.side !== p.side) targets.push({ r: nr, c: nc });
      };

      if (p.type === 'K') {
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          if (inPalace(p.side, r + dr, c + dc)) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'A') {
        [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([dr, dc]) => {
          if (inPalace(p.side, r + dr, c + dc)) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'E') {
        [[-2, -2, -1, -1], [-2, 2, -1, 1], [2, -2, 1, -1], [2, 2, 1, 1]].forEach(([dr, dc, er, ec]) => {
          const nr = r + dr, nc = c + dc;
          if (!inBounds(nr, nc)) return;
          if (p.side === 'r' && nr < 5) return;
          if (p.side === 'b' && nr > 4) return;
          if (!board[r + er][c + ec]) addIfValid(nr, nc);
        });
      } else if (p.type === 'H') {
        const jumps = [
          [-2, -1, -1, 0], [-2, 1, -1, 0], [2, -1, 1, 0], [2, 1, 1, 0],
          [-1, -2, 0, -1], [1, -2, 0, -1], [-1, 2, 0, 1], [1, 2, 0, 1],
        ];
        jumps.forEach(([dr, dc, lr, lc]) => {
          if (inBounds(r + dr, c + dc) && !board[r + lr][c + lc]) addIfValid(r + dr, c + dc);
        });
      } else if (p.type === 'R' || p.type === 'C') {
        [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
          let nr = r + dr, nc = c + dc;
          let jumped = false;
          while (inBounds(nr, nc)) {
            const occ = board[nr][nc];
            if (p.type === 'R') {
              if (!occ) targets.push({ r: nr, c: nc });
              else {
                if (occ.side !== p.side) targets.push({ r: nr, c: nc });
                break;
              }
            } else {
              if (!jumped) {
                if (!occ) targets.push({ r: nr, c: nc });
                else jumped = true;
              } else if (occ) {
                if (occ.side !== p.side) targets.push({ r: nr, c: nc });
                break;
              }
            }
            nr += dr;
            nc += dc;
          }
        });
      } else if (p.type === 'P') {
        const fwd = p.side === 'r' ? -1 : 1;
        addIfValid(r + fwd, c);
        const crossed = p.side === 'r' ? r <= 4 : r >= 5;
        if (crossed) {
          addIfValid(r, c - 1);
          addIfValid(r, c + 1);
        }
      }
      return targets;
    }

    function findKing(board, side) {
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.type === 'K' && p.side === side) return { r, c };
        }
      }
      return null;
    }

    function areKingsFacing(board) {
      const rk = findKing(board, 'r');
      const bk = findKing(board, 'b');
      if (!rk || !bk || rk.c !== bk.c) return false;
      for (let r = bk.r + 1; r < rk.r; r++) {
        if (board[r][rk.c]) return false;
      }
      return true;
    }

    function isKingInCheck(board, side) {
      if (areKingsFacing(board)) return true;
      const k = findKing(board, side);
      if (!k) return false;
      const opp = side === 'r' ? 'b' : 'r';
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.side === opp) {
            const targets = getPseudoTargets(board, r, c);
            if (targets.some((t) => t.r === k.r && t.c === k.c)) return true;
          }
        }
      }
      return false;
    }

    function getLegalMoves(board, r, c) {
      const p = board[r][c];
      if (!p) return [];
      const pseudo = getPseudoTargets(board, r, c);
      const legal = [];
      for (const to of pseudo) {
        const next = cloneBoard(board);
        const captured = next[to.r][to.c];
        next[to.r][to.c] = p;
        next[r][c] = null;
        if (!isKingInCheck(next, p.side)) {
          legal.push({ from: { r, c }, to, piece: p, captured });
        }
      }
      return legal;
    }

    function getAllLegalMoves(board, side) {
      const all = [];
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p && p.side === side) all.push(...getLegalMoves(board, r, c));
        }
      }
      return all;
    }

    function evaluateBoard(board) {
      let score = 0;
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (!p) continue;
          let val = PIECE_META[p.type].value;
          if (p.type === 'P' && (p.side === 'r' ? r <= 4 : r >= 5)) val += 14;
          score += p.side === 'r' ? val : -val;
        }
      }
      return score;
    }

    function findBestAIMove(board, side) {
      const moves = getAllLegalMoves(board, side);
      if (moves.length === 0) return null;
      let bestMove = moves[0];
      let bestVal = side === 'r' ? -Infinity : Infinity;
      for (const m of moves) {
        const next = cloneBoard(board);
        next[m.to.r][m.to.c] = m.piece;
        next[m.from.r][m.from.c] = null;
        const val = evaluateBoard(next) + (Math.random() - 0.5) * 4;
        if ((side === 'r' && val > bestVal) || (side === 'b' && val < bestVal)) {
          bestVal = val;
          bestMove = m;
        }
      }
      return bestMove;
    }

    /**********************************************************************
     * MODULE 6: 3D PERSONIFIED PIECES & CEL-SHADING (MeshToonMaterial + GLTFLoader)

    const gltfLoader = new GLTFLoader();

    // Optional external GLTF/GLB model registry (falls back to stylized procedural 3D miniature)

    const makeToonMat = (hex, side = THREE.FrontSide) =>

    const bronzeMat = makeToonMat(0xd97706);

    // Classic Disc Mode (Fallback option)
    function buildDiscUnit(type, side) {
      const root = new THREE.Group();
      const isRed = side === 'r';
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = isRed ? '#991b1b' : '#0369a1';
      ctx.beginPath();
      ctx.arc(128, 128, 120, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isRed ? '#fbbf24' : '#7dd3fc';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.fillStyle = '#fffbeb';
      ctx.font = '900 112px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(isRed ? PIECE_META[type].hanRed : PIECE_META[type].hanBlack, 128, 132);

      const capTex = new THREE.CanvasTexture(canvas);
      const bodyMat = makeToonMat(isRed ? 0xb91c1c : 0x0284c7);
      const topMat = new THREE.MeshBasicMaterial({ map: capTex });
      const cyl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.45, 0.24, 32),
        [bodyMat, topMat, bodyMat]
      );
      cyl.position.y = 0.12;
      root.add(cyl);
      return root;
    }

    /**********************************************************************
     * MODULE 7: TU TIÊN VFX (GLSL Bagua Magic Circle, Trail, Shockwave & God-Rays)
     **********************************************************************/
    const unitsRoot = new THREE.Group();
    const indicatorsRoot = new THREE.Group();
    const trailRoot = new THREE.Group();
    const vfxRoot = new THREE.Group();
    scene.add(unitsRoot, indicatorsRoot, trailRoot, vfxRoot);

    function createBaguaCanvasTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const cx = 512, cy = 512;

      ctx.strokeStyle = '#fef08a';
      ctx.fillStyle = '#fef08a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI) / 4 + Math.PI / 8;
        const x = cx + Math.cos(ang) * 455;
        const y = cy + Math.sin(ang) * 455;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      [415, 310, 220, 115].forEach((r, idx) => {
        ctx.lineWidth = idx === 0 ? 7 : 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      const baguaNames = ['乾', '兌', '離', '震', '巽', '坎', '艮', '坤'];
      ctx.font = '900 56px "Noto Serif SC", serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI) / 4;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.fillText(baguaNames[i], 0, -265);
        ctx.restore();
      }
      return new THREE.CanvasTexture(canvas);
    }

    // GLSL ShaderMaterial for Rotating Bagua Magic Circle under Selected Piece

    // Spawn Glowing Trail Segment during Piece Glide
    function spawnTrailDot(x, y, z, isRed) {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 10, 10),
        new THREE.MeshBasicMaterial({
          color: isRed ? 0xfef08a : 0x38bdf8,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending,
        })
      );
      dot.position.set(x, Math.max(0.08, y * 0.4), z);
      trailRoot.add(dot);
      gsap.to(dot.scale, { x: 0.1, y: 0.1, z: 0.1, duration: 0.42 });
      gsap.to(dot.material, {
        opacity: 0,
        duration: 0.42,
        onComplete: () => trailRoot.remove(dot),
      });
    }

    // Trigger "Kiếm Khí / Tuyệt Kỹ" on Capture: GLSL Golden Shockwave + 3D God-Rays + Camera Shake
    function triggerSwordQiCaptureVFX(coord) {
      const { x, z } = gridToWorld(coord.r, coord.c);
      audio.playSwordQiShockwave();

      // 1. Custom GLSL Golden Shockwave & Radial God-Rays Plane
      const shockUniforms = {
        uProgress: { value: 0.0 },
        uPrimaryColor: { value: new THREE.Color(0xfef08a) },
        uSecondaryColor: { value: new THREE.Color(0xf59e0b) },
      };
      const shockPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(5.8, 5.8),
        new THREE.ShaderMaterial({
          vertexShader: BAGUA_VERTEX_SHADER,
          fragmentShader: SHOCKWAVE_GODRAYS_FRAGMENT_SHADER,
          uniforms: shockUniforms,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        })
      );
      shockPlane.rotation.x = -Math.PI / 2;
      shockPlane.position.set(x, 0.045, z);
      vfxRoot.add(shockPlane);

      gsap.to(shockUniforms.uProgress, {
        value: 1.0,
        duration: 0.72,
        ease: 'power2.out',
        onComplete: () => vfxRoot.remove(shockPlane),
      });

      // 2. 3D Volumetric Light Rays / Sword-Qi Beams Bursting Across the Board
      for (let i = 0; i < 18; i++) {
        const isInk = i % 5 === 0;
        const rayMat = new THREE.MeshBasicMaterial({
          color: isInk ? 0x120c08 : i % 2 === 0 ? 0xfef08a : 0xf59e0b,
          transparent: true,
          opacity: 0.95,
          blending: isInk ? THREE.NormalBlending : THREE.AdditiveBlending,
        });
        const rayLen = 1.6 + Math.random() * 2.4;
        const ray = new THREE.Mesh(new THREE.ConeGeometry(0.08, rayLen, 6), rayMat);
        const ang = (i / 18) * Math.PI * 2;
        const tilt = 0.35 + Math.random() * 0.85;

        ray.position.set(x, 0.25, z);
        ray.rotation.y = ang;
        ray.rotation.z = Math.cos(ang) * tilt;
        ray.rotation.x = Math.sin(ang) * tilt;
        vfxRoot.add(ray);

        const dist = 2.0 + Math.random() * 1.8;
        gsap.to(ray.position, {
          x: x + Math.cos(ang) * dist,
          y: 0.85 + Math.random() * 2.2,
          z: z + Math.sin(ang) * dist,
          duration: 0.55,
          ease: 'power3.out',
        });
        gsap.to(ray.material, {
          opacity: 0,
          duration: 0.55,
          onComplete: () => vfxRoot.remove(ray),
        });
      }

      // 3. Subtle Camera Shake (Rung nhẹ Camera)
      const origX = camera.position.x;
      const origY = camera.position.y;
      const origZ = camera.position.z;
      gsap.fromTo(
        camera.position,
        { x: origX - 0.16, y: origY + 0.14 },
        {
          x: origX,
          y: origY,
          z: origZ,
          duration: 0.36,
          ease: 'elastic.out(1.2, 0.25)',
        }
      );
    }

    let activeLesson = null;

    const unitMeshes = new Map();

    function renderBoardUnits(board) {
      clearGroup(unitsRoot);
      clearGroup(indicatorsRoot);
      unitMeshes.clear();
      baguaCircleMesh.visible = false;

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 9; c++) {
          const p = board[r][c];
          if (p) {
            const unit =
              pieceStyle === 'living'
                ? buildLiving3DUnit(p.type, p.side)
                : buildDiscUnit(p.type, p.side);
            const pos = gridToWorld(r, c);
            unit.position.set(pos.x, 0, pos.z);
            unit.userData = { ...unit.userData, isUnit: true, r, c, type: p.type, side: p.side };
            unitsRoot.add(unit);
            unitMeshes.set(`${r},${c}`, unit);
          }
        }
      }
      updateTurnBadge();
    }

    function updateTurnBadge() {
      const badge = document.getElementById('turn-badge');
      if (currentTurn === 'r') {
        badge.textContent = '🔴 Phe Đỏ (Chu Vũ) Tiên Thủ';
        badge.className = 'font-bold text-amber-300 tracking-wide';
      } else {
        badge.textContent = '🔵 Phe Lam (Thanh Vân) Hậu Thủ';
        badge.className = 'font-bold text-sky-300 tracking-wide';
      }
    }

    function selectSquare(r, c) {
      if (isAnimating) return;

      if (selectedCoord) {
        const move = currentLegalMoves.find((m) => m.to.r === r && m.to.c === c);
        if (move) {
          executeTroopMove(move);
          return;
        }
      }

      const p = boardState[r][c];
      if (p && p.side === currentTurn) {
        selectedCoord = { r, c };
        currentLegalMoves = getLegalMoves(boardState, r, c);
        audio.playSelect();

        const pos = gridToWorld(r, c);
        baguaCircleMesh.position.set(pos.x, 0.028, pos.z);
        baguaCircleMesh.visible = true;
        gsap.fromTo(
          baguaCircleMesh.scale,
          { x: 0.25, y: 0.25, z: 0.25 },
          { x: 1, y: 1, z: 1, duration: 0.32, ease: 'back.out(1.8)' }
        );

        clearGroup(indicatorsRoot);
        currentLegalMoves.forEach((m) => {
          const pt = gridToWorld(m.to.r, m.to.c);
          const isCap = Boolean(boardState[m.to.r][m.to.c]);
          if (isCap) {
            const targetRing = new THREE.Mesh(
              new THREE.RingGeometry(0.45, 0.56, 28),
              new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide })
            );
            targetRing.rotation.x = -Math.PI / 2;
            targetRing.position.set(pt.x, 0.04, pt.z);
            indicatorsRoot.add(targetRing);
          } else {
            const orb = new THREE.Mesh(
              new THREE.OctahedronGeometry(0.13, 0),
              new THREE.MeshBasicMaterial({ color: 0xfef08a })
            );
            orb.position.set(pt.x, 0.2, pt.z);
            indicatorsRoot.add(orb);
          }
        });
      } else {
        selectedCoord = null;
        currentLegalMoves = [];
        baguaCircleMesh.visible = false;
        clearGroup(indicatorsRoot);
      }
    }

    function executeTroopMove(move) {
      isAnimating = true;
      selectedCoord = null;
      currentLegalMoves = [];
      baguaCircleMesh.visible = false;
      clearGroup(indicatorsRoot);

      const fromKey = `${move.from.r},${move.from.c}`;
      const toKey = `${move.to.r},${move.to.c}`;
      const mover = unitMeshes.get(fromKey);
      const target = unitMeshes.get(toKey);

      const start = gridToWorld(move.from.r, move.from.c);
      const end = gridToWorld(move.to.r, move.to.c);

      moveHistory.push({
        move,
        prevBoard: cloneBoard(boardState),
        prevTurn: currentTurn,
      });

      boardState[move.to.r][move.to.c] = move.piece;
      boardState[move.from.r][move.from.c] = null;

      let stepTick = 0;
      const proxy = { t: 0 };
      gsap.to(proxy, {
        t: 1,
        duration: 0.44,
        ease: 'power2.inOut',
        onUpdate: () => {
          const t = proxy.t;
          if (mover) {
            const cx = start.x + (end.x - start.x) * t;
            const cz = start.z + (end.z - start.z) * t;
            const cy = 4 * 1.4 * t * (1 - t);
            mover.position.set(cx, cy, cz);

            stepTick++;
            if (stepTick % 2 === 0) {
              spawnTrailDot(cx, cy, cz, move.piece.side === 'r');
            }
          }
        },
        onComplete: () => {
          if (mover) {
            mover.position.set(end.x, 0, end.z);
            mover.userData.r = move.to.r;
            mover.userData.c = move.to.c;
          }

          if (target && move.captured) {
            unitsRoot.remove(target);
            triggerSwordQiCaptureVFX(move.to);
          } else {
            audio.playMoveStep();
          }

          unitMeshes.delete(fromKey);
          if (mover) unitMeshes.set(toKey, mover);

          currentTurn = currentTurn === 'r' ? 'b' : 'r';
          updateTurnBadge();

          if (isKingInCheck(boardState, currentTurn)) {
            const kingCoord = findKing(boardState, currentTurn);
            if (kingCoord) triggerSwordQiCaptureVFX(kingCoord);
            const vig = document.getElementById('check-vignette');
            const ban = document.getElementById('check-banner');
            vig.style.opacity = '1';
            gsap.fromTo(
              ban,
              { opacity: 0, scale: 0.4 },
              {
                opacity: 1,
                scale: 1,
                duration: 0.35,
                ease: 'back.out(1.8)',
                onComplete: () => {
                  gsap.to(ban, { opacity: 0, scale: 1.3, delay: 0.85, duration: 0.35 });
                  setTimeout(() => (vig.style.opacity = '0'), 900);
                },
              }
            );
          }

          isAnimating = false;

          // LESSON STEP VERIFICATION OR FREE AI SPARRING
          if (activeLesson) {
            handleLessonMoveProgress(move);
          } else if (vsAI && currentTurn === 'b') {
            setTimeout(() => {
              const aiMove = findBestAIMove(boardState, 'b');
              if (aiMove) executeTroopMove(aiMove);
            }, 460);
          }
        },
      });
    }

        raycaster.setFromCamera(mouse, camera);

        const hits = raycaster.intersectObjects(unitsRoot.children, true);
        if (hits.length > 0) {
          let obj = hits[0].object;
          while (obj && !obj.userData?.isUnit) obj = obj.parent;
          if (obj?.userData?.isUnit) {

    // 60FPS Animation Loop with Post-Processing OutlineEffect & GLSL Uniform Updates
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (controls.enabled) controls.update();

      // Update GLSL Bagua Shader Time Uniform
      baguaShaderUniforms.uTime.value = elapsed;

      indicatorsRoot.children.forEach((orb) => {
        orb.rotation.y = elapsed * 2.5;
      });

      unitsRoot.children.forEach((u, i) => {
        if (u.userData?.bobGroup) {
          u.userData.bobGroup.position.y = 0.09 + Math.sin(elapsed * 2.8 + i * 0.45) * 0.015;
        }
      });

      // Falling Peach Blossom Petals
      const posAttr = petalGeo.attributes.position;
      for (let i = 0; i < petalCount; i++) {
        let y = posAttr.getY(i) - 0.018;
        let x = posAttr.getX(i) + Math.sin(elapsed * 1.2 + i) * 0.009;
        let z = posAttr.getZ(i) + Math.cos(elapsed * 0.9 + i) * 0.006;
        if (y < -1.5) y = 8.5;
        posAttr.setXYZ(i, x, y, z);
      }
      posAttr.needsUpdate = true;

      // Render through Post-Processing Cel-Shaded OutlineEffect
      outlineEffect.render(scene, camera);
    }

    /**********************************************************************
     * MODULE 9: LESSON & ROADMAP INTERACTION CONTROLLER
     **********************************************************************/
    function showLessonFeedback(msg, isSuccess = true) {
      const fb = document.getElementById('lesson-feedback-box');
      fb.textContent = msg;
      fb.className = isSuccess
        ? 'text-xs text-amber-200 bg-amber-950/80 border border-amber-500/60 p-2.5 rounded-lg font-serif'
        : 'text-xs text-rose-300 bg-rose-950/80 border border-rose-600/60 p-2.5 rounded-lg font-serif';
      fb.classList.remove('hidden');
    }

    function handleLessonMoveProgress(move) {
      if (!activeLesson || !activeLesson.steps) return;
      const step = activeLesson.steps[activeStepIndex];
      if (!step) return;

      const isCorrect =
        move.from.r === step.playerMove.from.r &&
        move.from.c === step.playerMove.from.c &&
        move.to.r === step.playerMove.to.r &&
        move.to.c === step.playerMove.to.c;

      if (isCorrect) {
        audio.playSwordQiShockwave();
        showLessonFeedback('✨ ' + step.playerMove.notation + ': ' + step.playerMove.whyBest, true);

        if (step.opponentReply) {
          setTimeout(() => {
            const oppFrom = step.opponentReply.from;
            const oppTo = step.opponentReply.to;
            const oppPiece = boardState[oppFrom.r][oppFrom.c];
            if (oppPiece) {
              executeTroopMove({
                from: oppFrom,
                to: oppTo,
                piece: oppPiece,
                captured: boardState[oppTo.r][oppTo.c],
              });
            }
            activeStepIndex++;
          }, 500);
        } else {
          // Check if this was the last step
          if (activeStepIndex + 1 >= activeLesson.steps.length) {
            triggerLessonVictory();
          } else {
            activeStepIndex++;
          }
        }
      } else {
        // Check if player's alternate move delivered checkmate anyway
        if (isKingInCheck(boardState, 'b') && isCheckmateOrNoMoves(boardState, 'b')) {
          triggerLessonVictory();
        } else {
          showLessonFeedback('⚠️ Nước cờ chưa tối ưu trong thế này! ' + (activeLesson.hints[0] || 'Hãy thử lại hoặc xem gợi ý!'), false);
        }
      }
    }

    function triggerLessonVictory() {
      audio.playSwordQiShockwave();
      triggerSwordQiCaptureVFX({ r: 4, c: 4 });
      const vicModal = document.getElementById('lesson-victory-banner');
      const vicDesc = document.getElementById('lesson-victory-desc');
      vicDesc.textContent = 'Bạn đã hoàn thành xuất sắc thế cờ: ' + activeLesson.title + ' (+' + (activeLesson.expReward || 50) + ' EXP)';
      vicModal.classList.remove('hidden');
      vicModal.classList.add('flex');
    }

    function loadLesson(lesson) {
      activeLesson = lesson;
      activeStepIndex = 0;
      currentHintLevel = 0;

      const parsed = parseFEN(lesson.initialFen);
      boardState = parsed.board;
      currentTurn = parsed.turn;
      moveHistory = [];

      renderBoardUnits(boardState);

      // Update Floating HUD Card
      document.getElementById('lesson-tier-badge').textContent = 'Tầng ' + lesson.tier + ' • ' + lesson.id;
      document.getElementById('lesson-title').textContent = lesson.title;
      document.getElementById('lesson-objective').textContent = lesson.objective;
      document.getElementById('hint-step-count').textContent = '0';
      document.getElementById('hint-box').classList.add('hidden');
      document.getElementById('lesson-feedback-box').classList.add('hidden');

      const card = document.getElementById('lesson-card');
      card.classList.remove('hidden');
      card.classList.add('flex');

      closeMasteryDrawer();
    }

    function returnToFreeMatch() {
      activeLesson = null;
      activeStepIndex = 0;
      currentHintLevel = 0;
      boardState = parseFEN(INITIAL_FEN).board;
      currentTurn = 'r';
      moveHistory = [];
      renderBoardUnits(boardState);

      document.getElementById('lesson-card').classList.add('hidden');
      document.getElementById('lesson-victory-banner').classList.add('hidden');
      closeMasteryDrawer();
      triggerSwordQiCaptureVFX({ r: 4, c: 4 });
    }

    function openMasteryDrawer() {
      document.getElementById('mastery-drawer-backdrop').classList.remove('hidden');
      document.getElementById('mastery-drawer').classList.remove('translate-x-full');
      renderTierLessons(currentDrawerTier);
    }

    function closeMasteryDrawer() {
      document.getElementById('mastery-drawer-backdrop').classList.add('hidden');
      document.getElementById('mastery-drawer').classList.add('translate-x-full');
    }

    function renderTierLessons(tier) {
      currentDrawerTier = tier;
      document.querySelectorAll('.tier-tab-btn').forEach((btn) => {
        const t = parseInt(btn.getAttribute('data-tier'), 10);
        if (t === tier) {
          btn.className = 'tier-tab-btn py-2 px-1 text-center rounded-lg font-bold transition cursor-pointer bg-amber-700 text-amber-100 shadow-md';
        } else {
          btn.className = 'tier-tab-btn py-2 px-1 text-center rounded-lg font-bold transition cursor-pointer bg-stone-800 text-stone-400 hover:text-amber-200';
        }
      });

      const tierMeta = XIANGQI_MASTERY_DATA.tiers.find((t) => t.tier === tier) || XIANGQI_MASTERY_DATA.tiers[0];
      const introBox = document.getElementById('tier-intro-box');
      introBox.innerHTML = '<span class="font-bold text-amber-300">' + tierMeta.name + ' (' + tierMeta.period + '):</span> ' + tierMeta.goal;

      const lessons = XIANGQI_MASTERY_DATA.lessons.filter((l) => l.tier === tier);
      const container = document.getElementById('lessons-list-container');
      container.innerHTML = '';

      lessons.forEach((l) => {
        const card = document.createElement('div');
        card.className = 'p-3.5 rounded-xl bg-stone-900/90 border border-amber-900/40 hover:border-amber-500/70 transition flex flex-col gap-2 shadow-md';
        const stars = '⭐'.repeat(l.difficulty || 1);
        card.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-950/80 text-amber-300 border border-amber-800/60">${l.id} • ${stars}</span>
            <span class="text-xs text-amber-400/90 font-bold">+${l.expReward || 50} EXP</span>
          </div>
          <div>
            <h4 class="font-bold text-amber-200 text-sm leading-snug">${l.title}</h4>
            <p class="text-xs text-stone-300 mt-1 line-clamp-2 leading-relaxed font-serif">${l.objective}</p>
          </div>
          <div class="flex items-center justify-between pt-1">
            <span class="text-[11px] text-stone-400 italic">${l.subtitle || ''}</span>
            <button class="btn-select-lesson px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-700 to-amber-800 hover:from-amber-600 hover:to-amber-700 text-stone-950 font-black text-xs cursor-pointer shadow transition">
              ⚔️ Bày Thế Lên Sa Bàn
            </button>
          </div>
        `;
        card.querySelector('.btn-select-lesson').addEventListener('click', () => {
          loadLesson(l);
        });
        container.appendChild(card);
      });
    }

    // Attach Event Handlers
    document.getElementById('seal-mastery').addEventListener('click', openMasteryDrawer);
    document.getElementById('btn-top-mastery').addEventListener('click', openMasteryDrawer);
    document.getElementById('btn-close-drawer').addEventListener('click', closeMasteryDrawer);
    document.getElementById('mastery-drawer-backdrop').addEventListener('click', closeMasteryDrawer);
    document.getElementById('btn-free-mode').addEventListener('click', returnToFreeMatch);

    document.querySelectorAll('.tier-tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tier = parseInt(btn.getAttribute('data-tier'), 10);
        renderTierLessons(tier);
      });
    });

    document.getElementById('btn-close-lesson').addEventListener('click', returnToFreeMatch);
    document.getElementById('btn-reset-lesson').addEventListener('click', () => {
      if (activeLesson) loadLesson(activeLesson);
    });

    document.getElementById('btn-show-hint').addEventListener('click', () => {
      if (!activeLesson || !activeLesson.hints) return;
      currentHintLevel = currentHintLevel < 3 ? currentHintLevel + 1 : 3;
      document.getElementById('hint-step-count').textContent = currentHintLevel;
      const hintBox = document.getElementById('hint-box');
      hintBox.textContent = '💡 Gợi ý ' + currentHintLevel + '/3: ' + activeLesson.hints[currentHintLevel - 1];
      hintBox.classList.remove('hidden');
    });

    document.getElementById('btn-prev-lesson').addEventListener('click', () => {
      if (!activeLesson) return;
      const idx = XIANGQI_MASTERY_DATA.lessons.findIndex((l) => l.id === activeLesson.id);
      if (idx > 0) loadLesson(XIANGQI_MASTERY_DATA.lessons[idx - 1]);
    });

    document.getElementById('btn-next-lesson').addEventListener('click', () => {
      if (!activeLesson) return;
      const idx = XIANGQI_MASTERY_DATA.lessons.findIndex((l) => l.id === activeLesson.id);
      if (idx < XIANGQI_MASTERY_DATA.lessons.length - 1) loadLesson(XIANGQI_MASTERY_DATA.lessons[idx + 1]);
    });

    document.getElementById('btn-next-after-win').addEventListener('click', () => {
      document.getElementById('lesson-victory-banner').classList.add('hidden');
      if (activeLesson) {
        const idx = XIANGQI_MASTERY_DATA.lessons.findIndex((l) => l.id === activeLesson.id);
        if (idx < XIANGQI_MASTERY_DATA.lessons.length - 1) {
          loadLesson(XIANGQI_MASTERY_DATA.lessons[idx + 1]);
        } else {
          openMasteryDrawer();
        }
      }
    });

    document.getElementById('btn-close-victory').addEventListener('click', () => {
      document.getElementById('lesson-victory-banner').classList.add('hidden');
    });

    camera.lookAt(0, 0, 0);
    renderBoardUnits(boardState);
    setTimeout(() => selectSquare(7, 1), 300);
    animate();
  </script>
</body>
</html>
